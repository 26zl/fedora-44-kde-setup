name: ShellCheck

on:
  push:
    branches: ["*"]
    paths:
      - "scripts/**"
      - "**.sh"
  pull_request:
    branches: ["*"]
    paths:
      - "scripts/**"
      - "**.sh"

permissions:
  contents: read

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."
          severity: warning
          # configs/ holds sourced dotfile fragments (bashrc, fish), not standalone scripts
          ignore_paths: configs
