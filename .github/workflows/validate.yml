name: Validate Configs

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"  # weekly, catches upstream package renames

permissions:
  contents: read

# Superseded runs on the same ref are pointless once a newer commit exists.
concurrency:
  group: "validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate config files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check no plaintext passwords or IPs in configs
        run: |
          echo "Checking for sensitive patterns..."
          # Fail if any private IPv4 ranges hardcoded (except localhost)
          if grep -rE '(192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+)' \
            --include="*.conf" --include="*.toml" --include="*.sh" --include="*.desktop" .; then
            echo "WARNING: Hardcoded private IP found — remove before committing"
            exit 1
          fi
          echo "No hardcoded IPs found."

      - name: Validate TOML files
        run: |
          for f in $(find . -name "*.toml" -not -path "./.git/*"); do
            echo "Validating $f"
            python3 -c "import tomllib; tomllib.load(open('$f','rb'))" && echo "  OK" || exit 1
          done

      - name: Validate XML files
        run: |
          for f in $(find . -name "*.xml" -not -path "./.git/*"); do
            echo "Validating $f"
            python3 -c "import xml.etree.ElementTree as ET; ET.parse('$f')" && echo "  OK" || exit 1
          done

      - name: Validate udev rules
        run: |
          udevadm verify --no-style system/*.rules

      - name: Check shell scripts are executable-safe
        run: |
          for f in scripts/*.sh scripts/lib/*.sh tests/*.sh system/kwin-display-fix.sh; do
            bash -n "$f" && echo "$f: syntax OK" || exit 1
          done

      - name: Run the hardware detection tests
        run: bash tests/hw-detect.sh

      - name: Check every system/ file is deployed by apply-system.sh
        run: |
          missing=0
          for f in system/*; do
            base=$(basename "$f")
            grep -qF "$base" scripts/apply-system.sh || { echo "NOT DEPLOYED by apply-system.sh: $f"; missing=1; }
          done
          exit $missing

  packages:
    name: Check every package the scripts install exists
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: registry.fedoraproject.org/fedora:44

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add the repos the scripts add
        run: |
          dnf -y -q install dnf5-plugins
          dnf -y -q install \
            "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm" \
            "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm"
          for c in $(grep -hoP 'copr enable -y \K\S+' scripts/*.sh); do dnf -y -q copr enable "$c"; done
          dnf -y -q install --repofrompath "terra,https://repos.fyralabs.com/terra$(rpm -E %fedora)" \
            --setopt="terra.gpgkey=https://repos.fyralabs.com/terra$(rpm -E %fedora)/key.asc" terra-release
          # imports the repo signing keys once; repoquery would otherwise stop at the prompt
          dnf -y -q makecache

      - name: Resolve every package
        run: |
          missing=0
          for p in $(sed ':a;/\\$/{N;s/\\\n//;ba}' scripts/*.sh | grep -oP 'dnf install -y \K.*' |
                     tr ' ' '\n' | grep -E '^[a-z0-9][a-z0-9._+-]*$' | sort -u); do
            dnf -q repoquery --available "$p" | grep -q . || { echo "not available: $p"; missing=1; }
          done
          exit $missing
