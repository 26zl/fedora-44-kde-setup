[Service]
# systemd-user-runtime-dir sets a ~80% per-user quota on /dev/shm at every login
# (systemd 259). /dev/shm can't be mounted without usrquota, so clear the limit
# right after it's set. ExecStartPost runs after ExecStart, so timing is guaranteed.
ExecStartPost=-/usr/sbin/setquota -u %i 0 0 0 0 /dev/shm
