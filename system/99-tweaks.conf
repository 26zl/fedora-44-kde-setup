vm.swappiness=180
# zram is RAM-fast, not rotational: read one page at a time, no readahead
vm.page-cluster=0
vm.max_map_count=2147483642
net.core.rmem_max=16777216
net.core.wmem_max=16777216
vm.compaction_proactiveness=0
vm.page_lock_unfairness=1
fs.inotify.max_user_instances=512
# hide kernel symbol addresses from unprivileged users
# (1, not 2: perf/bpftrace symbol resolution still works — this box profiles)
kernel.kptr_restrict=1
# kernel log to root only
kernel.dmesg_restrict=1
# harden BPF JIT compiler
net.core.bpf_jit_harden=2
# protect FIFOs and regular files from symlink/hardlink race attacks
fs.protected_fifos=2
fs.protected_regular=2
# no core dumps from setuid binaries (Fedora default is 2 = root-readable dumps)
fs.suid_dumpable=0
# drop RFC1337 TIME-WAIT assassination packets
net.ipv4.tcp_rfc1337=1
# symlink/hardlink protection in world-writable dirs
fs.protected_symlinks=1
fs.protected_hardlinks=1
# SYN flood protection
net.ipv4.tcp_syncookies=1
# ICMP redirects and source routing: never legitimate on a workstation
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.secure_redirects=0
net.ipv4.conf.default.secure_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv6.conf.all.accept_source_route=0
# prefer IPv6 privacy (temporary) addresses for outgoing connections
net.ipv6.conf.all.use_tempaddr=2
net.ipv6.conf.default.use_tempaddr=2
# prevent auto-loading of TTY line discipline modules
dev.tty.ldisc_autoload=0
# log packets with impossible source addresses
net.ipv4.conf.all.log_martians=1
net.ipv4.conf.default.log_martians=1
# anti-spoofing, loose mode: strict (1) drops Mullvad's policy-routed and
# container return traffic, which is asymmetric by design
net.ipv4.conf.all.rp_filter=2
net.ipv4.conf.default.rp_filter=2
# restrict ptrace to parent-child (blocks same-user process memory scraping; gdb/strace still work under sudo)
kernel.yama.ptrace_scope=1
# block runtime kernel replacement via kexec (undercuts Secure Boot); no kdump in use
kernel.kexec_load_disabled=1
