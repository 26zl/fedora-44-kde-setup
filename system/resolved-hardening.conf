[Resolve]
# no DNS=/Domains=~. — a forced global resolver leaks past the VPN; FallbackDNS
# applies only when no link DNS exists, so it never overrides the tunnel
FallbackDNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
# LLMNR is a LAN name-spoofing vector, redundant with DNS + Tailscale MagicDNS
LLMNR=no
MulticastDNS=no
