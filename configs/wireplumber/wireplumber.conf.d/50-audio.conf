monitor.alsa.rules = [
  # disable: Ryzen onboard audio, Radeon iGPU HDMI, any webcam mic. Matched on
  # PCI IDs and form factor, which survive bus renumbering and hardware swaps.
  # NVIDIA HDMI/DP needs no rule: the default profile follows the connected
  # monitor and names it from ELD; pro-audio PCMs are assigned dynamically.
  {
    matches = [
      { device.vendor.id = "0x1022", device.product.id = "0x15e3" }
      { device.vendor.id = "0x1002", device.product.id = "0x1640" }
      { device.form-factor = "webcam" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
